name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

env:
  GCP_PROJECT: civic-pulse-480006
  GCP_REGION: us-central1
  CLUSTER_ZONE: us-central1-a
  IMAGE_REGISTRY: us-central1-docker.pkg.dev
  IMAGE_REPO: civicpulse
  CLUSTER_NAME: civicpulse-cluster
  NAMESPACE: civicpulse

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # For Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure Docker for Artifact Registry
        run: |
          # Configure Docker to use gcloud as credential helper for Artifact Registry
          gcloud auth configure-docker ${{ env.IMAGE_REGISTRY }} --quiet

      - name: Verify Artifact Registry repository exists
        run: |
          # Verify the Artifact Registry repository exists
          echo "Verifying Artifact Registry repository: ${{ env.IMAGE_REPO }}"
          gcloud artifacts repositories describe ${{ env.IMAGE_REPO }} \
            --location=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} || {
            echo "Error: Artifact Registry repository '${{ env.IMAGE_REPO }}' not found in ${{ env.GCP_REGION }}"
            echo "Please create it manually or check the repository name"
            exit 1
          }
          echo "Artifact Registry repository verified: ${{ env.IMAGE_REPO }}"

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            echo "Error: Missing required secret GOOGLE_CLIENT_ID"
            exit 1
          fi

      - name: Build and push Frontend image
        working-directory: civicpulse
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            -t ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-frontend:${{ github.sha }} \
            -t ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-frontend:latest \
            -f src/Dockerfile .
          docker push ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-frontend:${{ github.sha }}
          docker push ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-frontend:latest

      - name: Build and push Ingestion image
        working-directory: civicpulse/src/ingestion
        run: |
          docker build \
            -t ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-ingestion:${{ github.sha }} \
            -t ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-ingestion:latest \
            -f Dockerfile .
          docker push ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-ingestion:${{ github.sha }}
          docker push ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-ingestion:latest

      - name: Build and push Processing image
        working-directory: civicpulse/src/processing
        run: |
          docker build \
            -t ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-processing:${{ github.sha }} \
            -t ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-processing:latest \
            -f Dockerfile .
          docker push ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-processing:${{ github.sha }}
          docker push ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-processing:latest

      - name: Build and push LM Parser image
        working-directory: civicpulse/src/lm_parser
        run: |
          docker build \
            -t ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-lm-parser:${{ github.sha }} \
            -t ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-lm-parser:latest \
            -f Dockerfile .
          docker push ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-lm-parser:${{ github.sha }}
          docker push ${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-lm-parser:latest

      - name: Configure kubectl for GKE
        run: |
          # Configure kubectl to use the GKE cluster (this sets up the auth plugin)
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --zone ${{ env.CLUSTER_ZONE }} \
            --project ${{ env.GCP_PROJECT }}
          # Verify kubectl can connect
          kubectl cluster-info || echo "Warning: kubectl cluster-info failed, but continuing..."

      - name: Deploy to Kubernetes (no Pulumi)
        run: |
          set -e
          NAMESPACE="${{ env.NAMESPACE }}"
          echo "Deploying images to namespace: $NAMESPACE"

          FRONTEND_IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-frontend:${{ github.sha }}"
          INGESTION_IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-ingestion:${{ github.sha }}"
          PROCESSING_IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-processing:${{ github.sha }}"
          LM_PARSER_IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.IMAGE_REPO }}/civicpulse-lm-parser:${{ github.sha }}"

          # Update images for long-running Deployments (if they exist)
          kubectl -n "$NAMESPACE" set image deployment/frontend frontend="$FRONTEND_IMAGE" --ignore-not-found=true || true
          kubectl -n "$NAMESPACE" set image deployment/ingestion ingestion="$INGESTION_IMAGE" --ignore-not-found=true || true
          kubectl -n "$NAMESPACE" set image deployment/lm-parser lm-parser="$LM_PARSER_IMAGE" --ignore-not-found=true || true

          # Processing is a Job in this repo's Pulumi stack. Jobs can't be "restarted"; delete it so it can be re-created manually when needed.
          kubectl -n "$NAMESPACE" delete job/processing --ignore-not-found=true || true

          # Rollout status (best-effort)
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=5m || true
          kubectl -n "$NAMESPACE" rollout status deployment/ingestion --timeout=2m || true
          kubectl -n "$NAMESPACE" rollout status deployment/lm-parser --timeout=2m || true
